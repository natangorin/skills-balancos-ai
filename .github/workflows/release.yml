name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Valida as skills
        run: python3 scripts/check.py
      - name: Gera os zips
        run: make zips
      - name: Extrai as notas do CHANGELOG
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '
            $0 ~ "^## \\[" v "\\]" {p=1; next}
            /^## \[/ {p=0}
            p' CHANGELOG.md > notas.md
          if [ ! -s notas.md ]; then
            echo "CHANGELOG.md não tem a seção ## [$v]" >&2
            exit 1
          fi
          cat notas.md
      - name: Publica a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --title "$GITHUB_REF_NAME" --notes-file notas.md
